name: Implement labeled issue

"on":
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: read
  pull-requests: write

concurrency:
  group: issue-to-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    if: github.event.label.name == 'codex:implement' && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --global @openai/codex@latest
      - run: npx playwright install --with-deps chromium
      - name: Implement issue and create PR
        run: node scripts/run-issue-workflow.ts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          CODEX_MODEL: ${{ vars.CODEX_MODEL || 'gpt-6.1-sol' }}
